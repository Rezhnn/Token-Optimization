<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1260" viewBox="0 0 1180 1260" role="img" aria-labelledby="title desc">
  <title id="title">Showcase Benchmark Visualization (Estimated)</title>
  <desc id="desc">An illustrative chart that compares normalized token load before and after applying the FinOps workspace skill rules. It is not a measured benchmark.</desc>

  <rect x="0" y="0" width="1180" height="1260" fill="#f8fafc"/>
  <rect x="24" y="24" width="1132" height="1212" rx="22" fill="#ffffff" stroke="#d8dde3" stroke-width="2"/>

  <text x="64" y="92" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">
    Showcase Benchmark Visualization (ESTIMATED)
  </text>
  <text x="64" y="126" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">
    Illustrative relative token load, normalized for readability. This is a visual explanation, not a measured benchmark result.
  </text>

  <rect x="64" y="150" width="250" height="34" rx="17" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="189" y="173" text-anchor="middle" fill="#1d4ed8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">
    ESTIMATED ONLY
  </text>

  <rect x="64" y="216" width="1052" height="520" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <text x="92" y="260" fill="#111827" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">
    Normalized token load index
  </text>
  <text x="92" y="286" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">
    Baseline is anchored to 100 so the relative drop is easy to compare visually.
  </text>

  <line x1="140" y1="320" x2="140" y2="642" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="140" y1="642" x2="1040" y2="642" stroke="#94a3b8" stroke-width="3"/>

  <g fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">
    <text x="118" y="646">0</text>
    <text x="108" y="566">25</text>
    <text x="108" y="486">50</text>
    <text x="108" y="406">75</text>
    <text x="100" y="326">100</text>
  </g>

  <g stroke="#eef2f7" stroke-width="1">
    <line x1="140" y1="562" x2="1040" y2="562"/>
    <line x1="140" y1="482" x2="1040" y2="482"/>
    <line x1="140" y1="402" x2="1040" y2="402"/>
    <line x1="140" y1="322" x2="1040" y2="322"/>
  </g>

  <g>
    <rect x="300" y="322" width="260" height="320" rx="18" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
    <rect x="355" y="322" width="150" height="320" rx="12" fill="#2563eb"/>
    <text x="430" y="686" text-anchor="middle" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
      Before using the skill
    </text>
    <text x="430" y="728" text-anchor="middle" fill="#1d4ed8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">
      100
    </text>
    <text x="430" y="756" text-anchor="middle" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">
      Normalized baseline
    </text>
  </g>

  <g>
    <rect x="650" y="578" width="260" height="64" rx="18" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
    <rect x="705" y="578" width="150" height="64" rx="12" fill="#16a34a"/>
    <text x="780" y="686" text-anchor="middle" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
      After using the skill
    </text>
    <text x="780" y="728" text-anchor="middle" fill="#15803d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">
      22
    </text>
    <text x="780" y="756" text-anchor="middle" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">
      Directional example
    </text>
  </g>

  <path d="M 560 392 C 620 392, 620 392, 680 392" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10"/>
  <path d="M 676 392 L 658 382 L 660 402 Z" fill="#f59e0b"/>
  <text x="620" y="366" text-anchor="middle" fill="#b45309" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">
    less unnecessary context
  </text>

  <rect x="88" y="780" width="324" height="286" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="428" y="780" width="324" height="286" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="768" y="780" width="324" height="286" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="116" y="824" fill="#111827" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
    1. What the numbers mean
  </text>
  <text x="116" y="854" fill="#334155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">
    <tspan x="116" dy="0">The chart starts with a baseline of 100.</tspan>
    <tspan x="116" dy="22">That makes the comparison easy to read</tspan>
    <tspan x="116" dy="22">without implying a specific measured run.</tspan>
  </text>

  <text x="456" y="824" fill="#111827" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
    2. Why the after value is 22
  </text>
  <text x="456" y="854" fill="#334155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">
    <tspan x="456" dy="0">The after state is a teaching estimate that</tspan>
    <tspan x="456" dy="22">suggests a large reduction in avoidable</tspan>
    <tspan x="456" dy="22">context load when the rules are followed.</tspan>
  </text>

  <text x="796" y="824" fill="#111827" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
    3. What the visual is for
  </text>
  <text x="796" y="854" fill="#334155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">
    <tspan x="796" dy="0">This figure helps readers understand the</tspan>
    <tspan x="796" dy="22">direction of the change: less wasted reading,</tspan>
    <tspan x="796" dy="22">more room for the actual task.</tspan>
  </text>

  <rect x="64" y="1094" width="1052" height="78" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="90" y="1130" fill="#9a3412" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">
    Caution
  </text>
  <text x="90" y="1156" fill="#7c2d12" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">
    This is a presentation graphic only. It does not report actual benchmark data, billing savings, or provider-side quota changes.
  </text>
  <text x="64" y="1198" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">
    Real results depend on the task, model, prompt shape, and how much unnecessary context the workspace rules prevent from being read.
  </text>
</svg>
